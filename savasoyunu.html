<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Strateji Oyunu</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://sametakyel.github.io/oyun.css">
</head>
<body>

<div id="lobby-modal">
  <h1 style="font-size: 28px; font-weight: bold; margin: 0;">Çok Oyunculu Lobi</h1>
  <p style="color: #94a3b8; font-size: 14px;">Bir oda kurun ya da arkadaşınızın oda kodunu girin.</p>

  <button onclick="createRoom()" style="padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; min-width: 200px;">
    ➕ Yeni Oda Kur (Host)
  </button>

  <div style="display: flex; gap: 8px; margin-top: 10px;">
    <input type="text" id="room-code-input" placeholder="Oda Kodu Girin" style="padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; text-align: center; font-weight: bold; font-size: 16px; text-transform: uppercase;">
    <button onclick="joinRoom()" style="padding: 10px 20px; background: #16a34a; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;">
      🚪 Odaya Katıl
    </button>
  </div>

  <p id="lobby-status" style="color: #f59e0b; font-size: 14px; margin-top: 10px; min-height: 20px; font-weight: bold;"></p>
</div>

<div id="portrait-warning">
    <div class="icon">📱🔄</div>
    <h2>Lütfen Cihazınızı Yatay Konuma Getirin</h2>
    <p style="margin-top: 8px; font-size: 14px; opacity: 0.8;">Bu oyun yalnızca yatay (Landscape) modda oynanabilir.</p>
</div>

<div id="toast"></div>

<div id="game-container">
    <div id="top-hud">
        <button class="btn-reset-hud" title="Seçimleri Temizle" onclick="resetSelections()">🛑 Clear</button>
        <div class="badge-info">💰 <span id="player-gold" style="color:#fbbf24;">50</span></div>
        <div class="badge-info"><span id="role-label" style="color:#60a5fa;">GİRİŞ YAPILMADI</span></div>
    </div>

    <div id="base-menu">
        <div class="base-menu-row">
            <button class="btn-base-action" onclick="spawnMyUnit('soldier')">
                <span>🪖 Piyade Üret</span> <span class="cost-tag">10P</span>
            </button>
        </div>
        <div class="base-menu-row">
            <button class="btn-base-action" onclick="spawnMyUnit('tank')">
                <span>🚜 Tank Üret</span> <span class="cost-tag">20P</span>
            </button>
        </div>
        <div class="base-menu-row">
            <button class="btn-base-action" onclick="spawnMyUnit('plane')">
                <span>✈️ Uçak Üret</span> <span class="cost-tag">30P</span>
            </button>
        </div>
        <div class="base-menu-row">
            <button class="btn-base-action btn-heal-action" id="btn-heal" onclick="healAllUnits()">
                <span>💚 Orduyu İyileştir</span> <span class="cost-tag" id="heal-timer-text">25P</span>
            </button>
        </div>
    </div>

    <div id="map-wrapper">
        <div id="grid-map"></div>
    </div>
</div>

<script>

  apiKey: "AIzaSyDd5DqjjMf9I3WyUGzuzrc1smzjYV1hkv8",
  authDomain: "savasgame-107ef.firebaseapp.com",

  projectId: "savasgame-107ef",

  messagingSenderId: "40599264451",
  appId: "1:40599264451:web:2333073bf3990b22e81676",
  measurementId: "G-LEFKSMRGPK"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

window.currentRoomId = null;
window.myRole = null;
window.isMultiplayerActive = false;
let broadcastInterval = null;

const GRID_COLS = 20;
let GRID_ROWS = 10;
const MAX_RANK = 3;

let playerGold = 50;
let units = [];
let selectedUnitId = null;

let isHealOnCooldown = false;
let healCooldownTimer = null;
let cellSizePx = 40;

let playerBase = { x: 1, y: 5, hp: 1000, maxHp: 1000, owner: 'player', isDestroyed: false };
let aiBase = { x: GRID_COLS - 2, y: 5, hp: 1000, maxHp: 1000, owner: 'ai', isDestroyed: false };

let rockObstacles = [];
let waterObstacles = [];

const UNIT_TYPES = {
    soldier: { category: 'soldier', cost: 10, hp: 30,  dmg: 8,   interval: 1600, moveSpeed: 450, attackRange: 1, maxLimit: 99, label: 'Piyade' },
    tank:    { category: 'tank',    cost: 20, hp: 120, dmg: 25,  interval: 2400, moveSpeed: 520, attackRange: 1, maxLimit: 5,  label: 'Tank' },
    plane:   { category: 'plane',   cost: 30, hp: 200, dmg: 45,  interval: 3600, moveSpeed: 240, attackRange: 1, maxLimit: 3,  label: 'Uçak' }
};

function createRoom() {
    const roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
    window.currentRoomId = roomId;
    window.myRole = 'player1';

    const roomRef = database.ref('rooms/' + roomId);

    roomRef.set({
      createdAt: Date.now(),
      status: 'waiting',
      player1: { ready: true, connected: true },
      player2: { ready: false, connected: false }
    }).then(function() {
      roomRef.onDisconnect().remove();
      roomRef.child('player1/connected').onDisconnect().set(false);
      updateLobbyStatus('Oda Kuruldu! Kod: <strong style="color:#60a5fa; font-size:20px;">' + roomId + '</strong> (Rakip bekleniyor...)');

      roomRef.child('player2/ready').on('value', function(snapshot) {
        if (snapshot.exists() && snapshot.val() === true) {
          roomRef.child('player2/ready').off();
          startMultiplayerGame();
        }
      });
    }).catch(function(err) {
      alert("Oda oluşturulamadı: " + err.message);
    });
}

function joinRoom() {
    const inputEl = document.getElementById('room-code-input');
    const inputCode = inputEl ? inputEl.value.trim().toUpperCase() : '';

    if (!inputCode) {
      alert("Lütfen geçerli bir oda kodu girin!");
      return;
    }

    const roomRef = database.ref('rooms/' + inputCode);

    roomRef.once('value').then(function(snapshot) {
      if (!snapshot.exists()) {
        alert("Oda bulunamadı! Lütfen kodu kontrol edin.");
        return;
      }

      const data = snapshot.val();
      const p2Connected = data.player2 && data.player2.connected;

      if (data.status === 'playing' && p2Connected) {
        alert("Bu oda dolu ve oyun devam ediyor!");
        return;
      }

      window.currentRoomId = inputCode;
      window.myRole = 'player2';

      roomRef.update({
        status: 'playing',
        'player2/ready': true,
        'player2/connected': true
      }).then(() => {
        roomRef.child('player2/connected').onDisconnect().set(false);
        startMultiplayerGame();
      });
    }).catch(function(err) {
      alert("Odaya bağlanırken hata oluştu: " + err.message);
    });
}

function startMultiplayerGame() {
    window.isMultiplayerActive = true;
    document.getElementById('lobby-modal').style.display = 'none';

    const roleText = window.myRole === 'player1' ? 'Mavi Takım (Sol)' : 'Kırmızı Takım (Sağ)';
    document.getElementById('role-label').innerText = 'ROL: ' + roleText;

    listenToOpponentData();
    listenToDisconnections();

    if (broadcastInterval) clearInterval(broadcastInterval);
    broadcastInterval = setInterval(broadcastMyState, 120);

    requestAnimationFrame(gameLoop);
}

function updateLobbyStatus(msg) {
    const el = document.getElementById('lobby-status');
    if (el) el.innerHTML = msg;
}

function listenToDisconnections() {
    const roomRef = database.ref('rooms/' + window.currentRoomId);
    const opponentRole = window.myRole === 'player1' ? 'player2' : 'player1';

    roomRef.child(opponentRole + '/connected').on('value', function(snapshot) {
        if (snapshot.exists() && snapshot.val() === false && window.isMultiplayerActive) {
            window.isMultiplayerActive = false;
            if (broadcastInterval) clearInterval(broadcastInterval);
            alert("Rakibin bağlantısı koptu veya oyundan ayrıldı!");
            location.reload();
        }
    });
}

function broadcastMyState() {
    if (!window.isMultiplayerActive || !window.currentRoomId) return;

    const myOwnerType = window.myRole === 'player1' ? 'player' : 'ai';
    
    // Kendi canlı birliklerimizi gönder
    const myUnits = units.filter(u => u.owner === myOwnerType);

    const unitsData = myUnits.map(u => ({
        id: u.id,
        type: u.type,
        x: Math.round(u.x * 100) / 100,
        y: Math.round(u.y * 100) / 100,
        hp: Math.max(0, u.hp),
        maxHp: u.maxHp || u.hp,
        shieldHp: Math.max(0, u.shieldHp || 0),
        rank: u.rank || 0,
        directionRow: u.directionRow || 0,
        isFlipped: !!u.isFlipped,
        isAttacking: !!u.isAttacking,
        isMoving: !!u.isMoving,
        isDestroyed: u.hp <= 0
    }));

    const myBase = window.myRole === 'player1' ? playerBase : aiBase;

    database.ref('rooms/' + window.currentRoomId + '/gameState/' + window.myRole).set({
      units: unitsData,
      baseHp: Math.max(0, myBase.hp),
      updatedAt: Date.now()
    });
}

function listenToOpponentData() {
    const opponentRole = window.myRole === 'player1' ? 'player2' : 'player1';
    const opponentOwnerType = window.myRole === 'player1' ? 'ai' : 'player';

    database.ref('rooms/' + window.currentRoomId + '/gameState/' + opponentRole).on('value', function(snapshot) {
      if (!snapshot.exists()) return;

      const data = snapshot.val();
      const networkUnits = data.units || [];
      const opponentBaseHp = data.baseHp;

      if (window.myRole === 'player1') {
        aiBase.hp = opponentBaseHp;
        if (aiBase.hp <= 0) aiBase.isDestroyed = true;
      } else {
        playerBase.hp = opponentBaseHp;
        if (playerBase.hp <= 0) playerBase.isDestroyed = true;
      }

      const activeOpponentIds = new Set();

      networkUnits.forEach(netUnit => {
        if (netUnit.isDestroyed || netUnit.hp <= 0) {
            const el = document.getElementById('unit-' + netUnit.id);
            if (el) el.remove();
            return;
        }

        activeOpponentIds.add(netUnit.id);
        let localUnit = units.find(u => u.id === netUnit.id);

        if (localUnit) {
          localUnit.x = netUnit.x;
          localUnit.y = netUnit.y;
          localUnit.hp = netUnit.hp;
          localUnit.shieldHp = netUnit.shieldHp;
          localUnit.rank = netUnit.rank;
          localUnit.directionRow = netUnit.directionRow;
          localUnit.isFlipped = netUnit.isFlipped;
          localUnit.isAttacking = netUnit.isAttacking;
          localUnit.isMoving = netUnit.isMoving;
          localUnit.isDestroyed = false;
        } else {
          units.push({
            id: netUnit.id,
            type: netUnit.type,
            owner: opponentOwnerType,
            x: netUnit.x,
            y: netUnit.y,
            hp: netUnit.hp,
            maxHp: netUnit.maxHp,
            shieldHp: netUnit.shieldHp,
            rank: netUnit.rank,
            directionRow: netUnit.directionRow,
            isFlipped: netUnit.isFlipped,
            isAttacking: netUnit.isAttacking,
            isMoving: netUnit.isMoving,
            isDestroyed: false,
            path: []
          });
        }
      });

      // Ağda görünmeyen rakip birimleri yerelden temizle
      for (let i = units.length - 1; i >= 0; i--) {
        const u = units[i];
        if (u.owner === opponentOwnerType && (!activeOpponentIds.has(u.id) || u.hp <= 0)) {
            const el = document.getElementById('unit-' + u.id);
            if (el) el.remove();
            units.splice(i, 1);
        }
      }

      syncUnitsDOM();
    });
}

function resizeGridMap() {
    const isLandscape = window.innerWidth > window.innerHeight;
    const portraitWarning = document.getElementById('portrait-warning');

    if (!isLandscape) {
        portraitWarning.style.display = 'flex';
        return;
    } else {
        portraitWarning.style.display = 'none';
    }

    cellSizePx = Math.floor(window.innerWidth / GRID_COLS);
    GRID_ROWS = Math.floor(window.innerHeight / cellSizePx);

    const midY = Math.floor(GRID_ROWS / 2);
    playerBase.y = midY;
    aiBase.y = midY;

    rockObstacles = [
        {x: 6, y: midY - 3}, {x: 6, y: midY - 2}, {x: 6, y: midY - 1},
        {x: 13, y: midY + 1}, {x: 13, y: midY + 2}, {x: 13, y: midY + 3}
    ];

    waterObstacles = [
        {x: 10, y: midY - 4}, {x: 10, y: midY - 3}, {x: 10, y: midY - 2},
        {x: 10, y: midY + 2}, {x: 10, y: midY + 3}, {x: 10, y: midY + 4}
    ];

    document.documentElement.style.setProperty('--cell-size', `${cellSizePx}px`);
    document.documentElement.style.setProperty('--grid-rows', GRID_ROWS);

    initGridMap();
    syncUnitsDOM();
}

function initGridMap() {
    const mapEl = document.getElementById('grid-map');
    mapEl.innerHTML = '';

    for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < GRID_COLS; c++) {
            const cell = document.createElement('div');
            cell.id = `cell-${c}-${r}`;
            cell.dataset.x = c;
            cell.dataset.y = r;

            let isRestrictedBorder = (c === 0 || c === GRID_COLS - 1);
            let isRock = rockObstacles.some(o => o.x === c && o.y === r);
            let isWater = waterObstacles.some(w => w.x === c && w.y === r);

            if (isRestrictedBorder) cell.className = 'cell cell-restricted';
            else if (isRock) cell.className = 'cell cell-rock';
            else if (isWater) cell.className = 'cell cell-water';
            else cell.className = 'cell';

            cell.addEventListener('click', (e) => {
                e.stopPropagation();
                handleCellClick(c, r);
            });
            mapEl.appendChild(cell);
        }
    }
}

function closeBaseMenu() {
    const baseMenu = document.getElementById('base-menu');
    if (baseMenu) baseMenu.style.display = 'none';
}

function openBaseMenuAroundMyBase() {
    const myBaseObj = window.myRole === 'player1' ? playerBase : aiBase;
    const baseMenu = document.getElementById('base-menu');
    const baseCell = document.getElementById(`cell-${myBaseObj.x}-${myBaseObj.y}`);
    if (!baseCell) return;

    const rect = baseCell.getBoundingClientRect();
    baseMenu.style.display = 'flex';
    if (window.myRole === 'player1') {
        baseMenu.style.left = `${rect.right + 10}px`;
    } else {
        baseMenu.style.left = `${rect.left - 160}px`;
    }
    baseMenu.style.top = `${Math.max(10, rect.top - 20)}px`;
}

document.body.addEventListener('click', () => {
    closeBaseMenu();
});

function getUnitOccupiedTiles(unit) {
    return [{ x: Math.round(unit.x), y: Math.round(unit.y) }].filter(t => t.x >= 0 && t.x < GRID_COLS && t.y >= 0 && t.y < GRID_ROWS);
}

function getBaseTiles(base) {
    let tiles = [];
    for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
            tiles.push({ x: base.x + dx, y: base.y + dy });
        }
    }
    return tiles.filter(t => t.x >= 0 && t.x < GRID_COLS && t.y >= 0 && t.y < GRID_ROWS);
}

function getBestAdjacentAttackTile(attacker, targetObj) {
    const targetTiles = targetObj.owner && !targetObj.type ? getBaseTiles(targetObj) : getUnitOccupiedTiles(targetObj);
    let validNeighbors = [];

    targetTiles.forEach(tTile => {
        let neighbors = [
            { x: tTile.x, y: tTile.y - 1 }, { x: tTile.x + 1, y: tTile.y },
            { x: tTile.x, y: tTile.y + 1 }, { x: tTile.x - 1, y: tTile.y },
            { x: tTile.x - 1, y: tTile.y - 1 }, { x: tTile.x + 1, y: tTile.y - 1 },
            { x: tTile.x - 1, y: tTile.y + 1 }, { x: tTile.x + 1, y: tTile.y + 1 }
        ];

        neighbors.forEach(n => {
            if (!targetTiles.some(tt => tt.x === n.x && tt.y === n.y) && !isTileBlockedForUnit(attacker, n.x, n.y, true)) {
                if (!validNeighbors.some(vn => vn.x === n.x && vn.y === n.y)) {
                    validNeighbors.push(n);
                }
            }
        });
    });

    if (validNeighbors.length === 0) return null;
    validNeighbors.sort((a, b) => heuristic(attacker.x, attacker.y, a.x, a.y) - heuristic(attacker.x, attacker.y, b.x, b.y));
    return validNeighbors[0];
}

function isTargetInAttackRange(attacker, targetObj) {
    const tilesA = getUnitOccupiedTiles(attacker);
    const tilesB = targetObj.owner && !targetObj.type ? getBaseTiles(targetObj) : getUnitOccupiedTiles(targetObj);
    const range = UNIT_TYPES[attacker.type].attackRange;

    for (let tA of tilesA) {
        for (let tB of tilesB) {
            let distX = Math.abs(tA.x - tB.x);
            let distY = Math.abs(tA.y - tB.y);
            if (distX <= range && distY <= range) return true;
        }
    }
    return false;
}

function findEmptySpawnTileAroundBase(base, type) {
    const directions = [
        { x: 0, y: -2 }, { x: 2, y: 0 }, { x: 0, y: 2 }, { x: -2, y: 0 },
        { x: 2, y: -2 }, { x: 2, y: 2 }, { x: -2, y: 2 }, { x: -2, y: -2 }
    ];

    for (let dir of directions) {
        let checkX = base.x + dir.x;
        let checkY = base.y + dir.y;

        if (checkX >= 1 && checkX <= GRID_COLS - 2 && checkY >= 1 && checkY < GRID_ROWS - 1) {
            let tempUnit = { type: type, x: checkX, y: checkY };
            let occ = getUnitOccupiedTiles(tempUnit);

            let hasObstacle = occ.some(t => 
                (type !== 'plane' && (rockObstacles.some(o => o.x === t.x && o.y === t.y) || waterObstacles.some(w => w.x === t.x && w.y === t.y)))
            );

            let isOccupiedByUnit = units.some(u => !u.isDestroyed && getUnitOccupiedTiles(u).some(ut => occ.some(t => t.x === ut.x && t.y === ut.y)));

            if (!hasObstacle && !isOccupiedByUnit) return { x: checkX, y: checkY };
        }
    }
    return null;
}

function spawnMyUnit(type) {
    if (!window.isMultiplayerActive) {
        showToast("Lütfen önce multiplayer bir odaya katılın!");
        return;
    }

    const myOwner = window.myRole === 'player1' ? 'player' : 'ai';
    const myBaseObj = window.myRole === 'player1' ? playerBase : aiBase;
    const config = UNIT_TYPES[type];
    const count = units.filter(u => u.owner === myOwner && u.type === type && !u.isDestroyed).length;

    if (count >= config.maxLimit) {
        showToast(`Maksimum ${config.maxLimit} ${config.label} sınırına ulaşıldı!`);
        return;
    }

    if (playerGold >= config.cost) {
        let spawnTile = findEmptySpawnTileAroundBase(myBaseObj, type);
        if (!spawnTile) {
            showToast("Bina çevresi dolu!");
            return;
        }
        playerGold -= config.cost;
        createUnit(type, myOwner, spawnTile.x, spawnTile.y);
        updateUI();
        closeBaseMenu();
    } else {
        showToast("Yetersiz altın!");
    }
}

function createUnit(type, owner, x, y) {
    const config = UNIT_TYPES[type];
    
    const unit = {
        id: 'u_' + Math.random().toString(36).substring(2, 9),
        type, owner, x, y,
        hp: config.hp, maxHp: config.hp, baseHp: config.hp, 
        shieldHp: 0, maxShieldHp: 0,
        baseDmg: config.dmg, kills: 0, rank: 0, 
        directionRow: owner === 'player' ? 2 : 2,
        isFlipped: owner === 'ai',
        lastAttack: 0, lastMoveTime: 0, 
        targetX: null, targetY: null, 
        targetUnitId: null, 
        path: [],
        isAttacking: false,
        isMoving: false,
        isDestroyed: false
    };
    units.push(unit);
    syncUnitsDOM();
}

function resetSelections() {
    selectedUnitId = null;
    closeBaseMenu();
    showToast("Tüm seçimler temizlendi.");
    syncUnitsDOM();
}

function handleCellClick(x, y) {
    closeBaseMenu();
    if (!window.isMultiplayerActive) return;

    const myOwner = window.myRole === 'player1' ? 'player' : 'ai';
    const opponentOwner = window.myRole === 'player1' ? 'ai' : 'player';
    const myBaseObj = window.myRole === 'player1' ? playerBase : aiBase;
    const opponentBaseObj = window.myRole === 'player1' ? aiBase : playerBase;

    if (x === 0 || x === GRID_COLS - 1) {
        showToast("Bu kenar bölgeye hareket edilemez!");
        return;
    }

    if (getBaseTiles(myBaseObj).some(t => t.x === x && t.y === y)) {
        selectedUnitId = null;
        openBaseMenuAroundMyBase();
        syncUnitsDOM();
        return;
    }

    const clickedUnit = units.find(u => !u.isDestroyed && getUnitOccupiedTiles(u).some(t => t.x === x && t.y === y));

    if (clickedUnit && clickedUnit.owner === myOwner) {
        selectedUnitId = clickedUnit.id;
        syncUnitsDOM();
        return;
    }

    if (selectedUnitId) {
        const unit = units.find(u => u.id === selectedUnitId);
        if (!unit || unit.owner !== myOwner) return;

        if (clickedUnit && clickedUnit.owner === opponentOwner) {
            unit.targetUnitId = clickedUnit.id;
            orderUnitToAttackTarget(unit, clickedUnit);
        }
        else if (getBaseTiles(opponentBaseObj).some(t => t.x === x && t.y === y)) {
            unit.targetUnitId = null;
            let bestTile = getBestAdjacentAttackTile(unit, opponentBaseObj);
            if (bestTile) setUnitTarget(unit, bestTile.x, bestTile.y);
        }
        else {
            unit.targetUnitId = null;
            setUnitTarget(unit, x, y);
        }

        selectedUnitId = null;
        syncUnitsDOM();
    }
}

function orderUnitToAttackTarget(unit, targetEnemy) {
    if (isTargetInAttackRange(unit, targetEnemy)) {
        unit.path = [];
        unit.targetX = null;
        unit.targetY = null;
        return;
    }

    let bestTile = getBestAdjacentAttackTile(unit, targetEnemy);
    if (bestTile) {
        setUnitTarget(unit, bestTile.x, bestTile.y);
    }
}

function setUnitTarget(unit, tx, ty) {
    unit.targetX = tx;
    unit.targetY = ty;
    unit.path = findPathAStar(unit, tx, ty);
}

function findPathAStar(unit, targetX, targetY) {
    let startX = Math.round(unit.x), startY = Math.round(unit.y);
    if (startX === targetX && startY === targetY) return [];

    let openSet = [], closedSet = new Set();
    openSet.push({ x: startX, y: startY, g: 0, h: heuristic(startX, startY, targetX, targetY), parent: null });

    while (openSet.length > 0) {
        openSet.sort((a, b) => (a.g + a.h) - (b.g + b.h));
        let current = openSet.shift();

        if (current.x === targetX && current.y === targetY) {
            let path = [];
            let temp = current;
            while (temp.parent) { path.push({ x: temp.x, y: temp.y }); temp = temp.parent; }
            return path.reverse();
        }

        closedSet.add(`${current.x},${current.y}`);

        let neighbors = [
            { x: current.x, y: current.y - 1 }, { x: current.x + 1, y: current.y },
            { x: current.x, y: current.y + 1 }, { x: current.x - 1, y: current.y },
            { x: current.x - 1, y: current.y - 1 }, { x: current.x + 1, y: current.y - 1 },
            { x: current.x - 1, y: current.y + 1 }, { x: current.x + 1, y: current.y + 1 }
        ];

        for (let n of neighbors) {
            if (n.x <= 0 || n.x >= GRID_COLS - 1 || n.y < 0 || n.y >= GRID_ROWS) continue;
            if (closedSet.has(`${n.x},${n.y}`)) continue;

            let isFinalStep = (n.x === targetX && n.y === targetY);
            if (isTileBlockedForUnit(unit, n.x, n.y, isFinalStep)) continue;

            let gScore = current.g + 1;
            let existingNode = openSet.find(o => o.x === n.x && o.y === n.y);

            if (!existingNode) {
                openSet.push({ x: n.x, y: n.y, g: gScore, h: heuristic(n.x, n.y, targetX, targetY), parent: current });
            } else if (gScore < existingNode.g) {
                existingNode.g = gScore;
                existingNode.parent = current;
            }
        }
    }
    return [];
}

function isTileBlockedForUnit(unit, checkX, checkY, isFinalDestination) {
    if (checkX <= 0 || checkX >= GRID_COLS - 1 || checkY < 0 || checkY >= GRID_ROWS) return true;

    const isPlayerBaseTile = getBaseTiles(playerBase).some(t => t.x === checkX && t.y === checkY);
    const isAiBaseTile = getBaseTiles(aiBase).some(t => t.x === checkX && t.y === checkY);
    if (isPlayerBaseTile || isAiBaseTile) return true;

    if (unit.type !== 'plane') {
        if (rockObstacles.some(o => o.x === checkX && o.y === checkY)) return true;
        if (waterObstacles.some(w => w.x === checkX && w.y === checkY)) return true;
    }

    const otherUnitsOnTile = units.filter(u => !u.isDestroyed && u.id !== unit.id && Math.round(u.x) === checkX && Math.round(u.y) === checkY);

    for (let otherUnit of otherUnitsOnTile) {
        if (otherUnit.owner !== unit.owner) {
            return true;
        } else {
            if (isFinalDestination) {
                return true;
            }
        }
    }

    return false;
}

function heuristic(x1, y1, x2, y2) { return Math.max(Math.abs(x1 - x2), Math.abs(y1 - y2)); }

function updateUnitDirection(unit, toX, toY) {
    let dx = toX - unit.x;
    let dy = toY - unit.y;
    if (dx === 0 && dy === 0) return;

    let angle = Math.atan2(dy, dx) * (180 / Math.PI);
    if (angle < 0) angle += 360;

    if (angle >= 247.5 && angle < 292.5) { 
        unit.directionRow = 0; unit.isFlipped = false;
    } else if (angle >= 292.5 && angle < 337.5) { 
        unit.directionRow = 1; unit.isFlipped = false;
    } else if (angle >= 337.5 || angle < 22.5) { 
        unit.directionRow = 2; unit.isFlipped = false;
    } else if (angle >= 22.5 && angle < 67.5) { 
        unit.directionRow = 3; unit.isFlipped = false;
    } else if (angle >= 67.5 && angle < 112.5) { 
        unit.directionRow = 4; unit.isFlipped = false;
    } else if (angle >= 112.5 && angle < 157.5) { 
        unit.directionRow = 3; unit.isFlipped = true;
    } else if (angle >= 157.5 && angle < 202.5) { 
        unit.directionRow = 2; unit.isFlipped = true;
    } else if (angle >= 202.5 && angle < 247.5) { 
        unit.directionRow = 1; unit.isFlipped = true;
    }
}

function triggerFireAnimation(x, y) {
    const cell = document.getElementById(`cell-${Math.round(x)}-${Math.round(y)}`);
    if (!cell) return;

    let fireEl = document.createElement("div");
    fireEl.className = "attack-effect";
    cell.appendChild(fireEl);

    setTimeout(() => { fireEl.remove(); }, 500);
}

setInterval(() => {
    if (window.isMultiplayerActive) {
        playerGold += 5;
        updateUI();
    }
}, 1000);

setInterval(() => {
    if (!window.isMultiplayerActive) return;
    const myOwner = window.myRole === 'player1' ? 'player' : 'ai';

    units.filter(u => u.owner === myOwner && !u.isDestroyed && u.targetUnitId).forEach(unit => {
        const targetEnemy = units.find(e => e.id === unit.targetUnitId && !e.isDestroyed);
        if (!targetEnemy) {
            unit.targetUnitId = null;
            unit.path = [];
            return;
        }

        if (isTargetInAttackRange(unit, targetEnemy)) {
            unit.path = [];
            unit.targetX = null;
            unit.targetY = null;
        } 
        else if (!unit.isMoving || (unit.path.length === 0)) {
            orderUnitToAttackTarget(unit, targetEnemy);
        }
    });
}, 500);

function gameLoop() {
    if (!window.isMultiplayerActive) return;
    const now = Date.now();
    const myOwner = window.myRole === 'player1' ? 'player' : 'ai';

    units.forEach(u => {
        if (u.isDestroyed || u.owner !== myOwner) return;

        const moveInterval = UNIT_TYPES[u.type].moveSpeed;

        if (u.path && u.path.length > 0) {
            u.isMoving = true;
            if (now - u.lastMoveTime >= moveInterval) {
                let nextStep = u.path[0];
                let isFinalStep = (u.path.length === 1);

                if (!isTileBlockedForUnit(u, nextStep.x, nextStep.y, isFinalStep)) {
                    updateUnitDirection(u, nextStep.x, nextStep.y);
                    u.x = nextStep.x;
                    u.y = nextStep.y;
                    u.lastMoveTime = now;
                    u.path.shift();
                } else {
                    if (u.targetX !== null && u.targetY !== null) {
                        u.path = findPathAStar(u, u.targetX, u.targetY);
                    }
                }
            }
        } else {
            u.isMoving = false;
        }
    });

    // Ölen kendi birimlerimizi ve rakip birimleri temizle
    for (let i = units.length - 1; i >= 0; i--) {
        if (units[i].hp <= 0) {
            const el = document.getElementById(`unit-${units[i].id}`);
            if (el) el.remove();
            units.splice(i, 1);
        }
    }

    syncUnitsDOM();
    requestAnimationFrame(gameLoop);
}

setInterval(() => {
    if (!window.isMultiplayerActive) return;
    const now = Date.now();
    const myOwner = window.myRole === 'player1' ? 'player' : 'ai';

    units.filter(u => u.owner === myOwner && !u.isDestroyed && u.hp > 0).forEach(attacker => {
        const attackInterval = UNIT_TYPES[attacker.type].interval;
        if (now - attacker.lastAttack < attackInterval) return;

        let targets = units.filter(target => target.owner !== attacker.owner && !target.isDestroyed && target.hp > 0 && isTargetInAttackRange(attacker, target));

        if (attacker.targetUnitId) {
            let lockedTarget = targets.find(t => t.id === attacker.targetUnitId);
            if (lockedTarget) targets = [lockedTarget, ...targets.filter(t => t.id !== attacker.targetUnitId)];
        }

        if (targets.length > 0) {
            const target = targets[0];
            
            if (!attacker.isMoving) {
                updateUnitDirection(attacker, target.x, target.y);
            }

            let baseDamage = attacker.baseDmg;
            let rankDamageBonus = attacker.rank * 0.35;
            let targetArmorReduction = target.rank * 0.20;

            let netDamage = Math.max(1, (baseDamage * (1 + rankDamageBonus)) * (1 - targetArmorReduction));

            // Hasarı yerelde düş
            if (target.shieldHp > 0) {
                if (target.shieldHp >= netDamage) {
                    target.shieldHp -= netDamage;
                } else {
                    let overflowDmg = netDamage - target.shieldHp;
                    target.shieldHp = 0;
                    target.hp -= overflowDmg;
                }
            } else {
                target.hp -= netDamage;
            }

            attacker.lastAttack = now;
            attacker.isAttacking = true;
            setTimeout(() => { attacker.isAttacking = false; }, 400);

            triggerFireAnimation(target.x, target.y);

            // Hedef birim öldüyse rütbe artışı ver
            if (target.hp <= 0) {
                target.hp = 0;
                target.isDestroyed = true;
                if (attacker.rank < MAX_RANK) {
                    attacker.kills += 1;
                    attacker.rank += 1;
                    showToast(`Birliğiniz Rütbe Atladı! ⭐x${attacker.rank}`);
                }
            }
        } else {
            const enemyBase = window.myRole === 'player1' ? aiBase : playerBase;
            if (isTargetInAttackRange(attacker, enemyBase)) {
                if (!attacker.isMoving) {
                    updateUnitDirection(attacker, enemyBase.x, enemyBase.y);
                }

                let netDamage = attacker.baseDmg * (1 + (attacker.rank * 0.35));
                enemyBase.hp -= netDamage;
                attacker.lastAttack = now;
                attacker.isAttacking = true;
                setTimeout(() => { attacker.isAttacking = false; }, 400);

                triggerFireAnimation(enemyBase.x, enemyBase.y);

                if (enemyBase.hp <= 0 && !enemyBase.isDestroyed) {
                    enemyBase.hp = 0;
                    enemyBase.isDestroyed = true;
                    syncUnitsDOM();
                    setTimeout(() => {
                        alert("TEBRİKLER! RAKİP BİNA YOK EDİLDİ, ZAFER SENİN!");
                        location.reload();
                    }, 800);
                }
            }
        }
    });
}, 400);

function healAllUnits() {
    if (isHealOnCooldown || !window.isMultiplayerActive) return;
    const myOwner = window.myRole === 'player1' ? 'player' : 'ai';
    const myBaseObj = window.myRole === 'player1' ? playerBase : aiBase;

    if (playerGold < 25) {
        showToast("Yetersiz Puan (25P Gerekli)!");
        return;
    }

    playerGold -= 25;

    if (selectedUnitId) {
        const unit = units.find(u => u.id === selectedUnitId && u.owner === myOwner);
        if (unit && !unit.isDestroyed) {
            unit.hp = unit.maxHp;
            let extraShield = unit.baseHp * 0.5;
            unit.maxShieldHp = extraShield;
            unit.shieldHp = extraShield;
            showToast("Seçili birimin canlı zırh barı genişletildi! 🛡️💙");
        }
    } else {
        myBaseObj.hp = Math.min(myBaseObj.maxHp, myBaseObj.hp + (myBaseObj.maxHp * 0.25));

        units.filter(u => u.owner === myOwner && !u.isDestroyed).forEach(u => {
            let healAmount = u.baseHp * 0.25;
            u.hp = Math.min(u.maxHp, u.hp + healAmount);
        });

        showToast("Tüm orduya %25 Can Desteği Verildi! 💚");
    }

    startHealCooldown();
    updateUI();
    syncUnitsDOM();
    closeBaseMenu();
}

function startHealCooldown() {
    isHealOnCooldown = true;

    const btn = document.getElementById("btn-heal");
    const timerText = document.getElementById("heal-timer-text");
    if (btn) btn.disabled = true;

    let timeLeft = 15;
    if (timerText) timerText.innerText = `${timeLeft}s`;

    healCooldownTimer = setInterval(() => {
        timeLeft--;
        const tEl = document.getElementById("heal-timer-text");
        if (timeLeft > 0) {
            if (tEl) tEl.innerText = `${timeLeft}s`;
        } else {
            clearInterval(healCooldownTimer);
            isHealOnCooldown = false;
            if (btn) btn.disabled = false;
            if (tEl) tEl.innerText = "25P";
        }
    }, 1000);
}

function syncUnitsDOM() {
    const mapEl = document.getElementById('grid-map');
    if (!mapEl) return;
    
    document.querySelectorAll('.cell').forEach(c => c.classList.remove('cell-selected'));

    units.forEach(u => {
        if (u.hp <= 0 || u.isDestroyed) {
            const el = document.getElementById(`unit-${u.id}`);
            if (el) el.remove();
            return;
        }

        if (u.id === selectedUnitId) {
            getUnitOccupiedTiles(u).forEach(t => {
                const c = document.getElementById(`cell-${t.x}-${t.y}`);
                if (c) c.classList.add('cell-selected');
            });
        }

        let unitEl = document.getElementById(`unit-${u.id}`);
        const config = UNIT_TYPES[u.type];

        const leftPx = u.x * cellSizePx;
        const topPx = u.y * cellSizePx;

        if (!unitEl) {
            unitEl = document.createElement('div');
            unitEl.id = `unit-${u.id}`;
            unitEl.className = 'unit-entity';
            
            unitEl.innerHTML = `
                <div class="unit-rank"></div>
                <div class="sprite-wrapper">
                    <div class="sprite-entity"></div>
                </div>
                <div class="hp-bar-wrapper">
                    <span class="hp-text-label"></span>
                    <div class="hp-bar-container">
                        <div class="hp-bar-fill"></div>
                        <div class="hp-bar-fill-bonus" style="display:none;"></div>
                    </div>
                </div>
            `;
            mapEl.appendChild(unitEl);
        }

        unitEl.style.width = `${cellSizePx}px`;
        unitEl.style.height = `${cellSizePx}px`;
        unitEl.style.left = `${leftPx}px`;
        unitEl.style.top = `${topPx}px`;
        unitEl.style.setProperty('--move-speed', `${config ? config.moveSpeed : 400}ms`);

        const rankEl = unitEl.querySelector('.unit-rank');
        const wrapperEl = unitEl.querySelector('.sprite-wrapper');
        const entityEl = unitEl.querySelector('.sprite-entity');
        const hpTextEl = unitEl.querySelector('.hp-text-label');
        const hpBarFillEl = unitEl.querySelector('.hp-bar-fill');
        const shieldBarFillEl = unitEl.querySelector('.hp-bar-fill-bonus');

        wrapperEl.className = `sprite-wrapper sprite-wrapper-${u.type}`;

        let activeRow = 0;
        if (u.isAttacking) {
            activeRow = u.directionRow + 5;
        } else {
            activeRow = u.directionRow;
        }

        let animClass = '';
        if (u.isAttacking) {
            animClass = 'sprite-attack';
        } else if (u.isMoving) {
            animClass = 'sprite-moving';
        }

        let flipClass = u.isFlipped ? 'sprite-flip' : '';
        let spriteClass = `sprite-${u.type}-${u.owner === 'player' ? 'player' : 'ai'}`;
        entityEl.className = `sprite-entity ${spriteClass} ${animClass} ${flipClass}`.trim();

        entityEl.style.setProperty('--row', activeRow);

        let totalCurrentHp = Math.round(Math.max(0, u.hp) + (u.shieldHp || 0));
        let hpPercent = Math.min(100, Math.max(0, (u.hp / u.maxHp) * 100));
        let shieldPercent = u.maxShieldHp > 0 ? Math.min(100, Math.max(0, (u.shieldHp / u.maxShieldHp) * 100)) : 0;
        let hpColorClass = u.owner === 'player' ? 'hp-bar-player' : 'hp-bar-ai';

        rankEl.innerText = u.rank > 0 ? '⭐'.repeat(u.rank) : '';
        hpTextEl.innerText = totalCurrentHp;
        
        hpBarFillEl.className = `hp-bar-fill ${hpColorClass}`;
        hpBarFillEl.style.width = `${hpPercent}%`;

        if (u.shieldHp > 0) {
            shieldBarFillEl.style.display = 'block';
            shieldBarFillEl.style.width = `${shieldPercent / 2}%`;
        } else {
            shieldBarFillEl.style.display = 'none';
        }
    });

    [playerBase, aiBase].forEach(b => {
        const cell = document.getElementById(`cell-${b.x}-${b.y}`);
        if (cell) {
            let hpPercent = Math.min(100, Math.max(0, (b.hp / b.maxHp) * 100));
            let hpColorClass = b.owner === 'player' ? 'hp-bar-player' : 'hp-bar-ai';
            let animStateClass = b.isDestroyed ? 'base-building-destroy' : '';

            cell.innerHTML = `
                <div class="base-building-entity ${animStateClass}"></div>
                <div class="base-hp-wrapper">
                    <span class="hp-text-label">${Math.round(Math.max(0, b.hp))}</span>
                    <div class="hp-bar-container">
                        <div class="hp-bar-fill ${hpColorClass}" style="width:${hpPercent}%;"></div>
                    </div>
                </div>
            `;
        }
    });
}

function updateUI() {
    document.getElementById("player-gold").innerText = playerGold;
}

function showToast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.innerText = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 2000);
}

window.addEventListener('resize', resizeGridMap);
window.addEventListener('orientationchange', () => {
    setTimeout(resizeGridMap, 150);
});

window.onload = () => {
    resizeGridMap();
    syncUnitsDOM();
};
</script>
</body>
