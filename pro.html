<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimdışı / Local AI Studio (GitHub Pages)</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(19, 26, 42, 0.75);
            --bg-input: #131b2e;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: #10b981;
            
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            
            --card-radius: 18px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 10% 10%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2.5rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 1100px; width: 100%; }

        header { text-align: center; margin-bottom: 2.5rem; }
        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        header p { color: var(--text-secondary); font-size: 0.95rem; }

        .layout-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 1.75rem;
        }

        @media (max-width: 900px) { .layout-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.75rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            height: fit-content;
        }

        .panel h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #fff;
        }
        .panel h2 i { color: var(--accent-green); }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.5rem; }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }
        .form-control:focus { border-color: var(--border-focus); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        textarea.form-control { height: 130px; resize: none; line-height: 1.5; }

        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, var(--accent-green) 0%, #059669 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
        }
        .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(16, 185, 129, 0.35); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-box {
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .results-container { display: flex; flex-direction: column; gap: 1.25rem; }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            animation: fadeInUp 0.4s ease forwards;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .badge-model {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .response-box {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #f1f5f9;
            background: rgba(9, 13, 22, 0.6);
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: pre-wrap;
        }

        .empty-state {
            text-align: center;
            padding: 3.5rem 1rem;
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; color: var(--accent-green); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WebGPU In-Browser AI Studio</h1>
        <p>Ağ İstek Hatası ve CORS Engeli Olmayan Sıfır API Key Yapay Zeka</p>
    </header>

    <div class="layout-grid">
        <div class="panel">
            <h2><i class="fa-solid fa-microchip"></i> İstem Paneli</h2>
            <form id="aiForm">
                <div class="form-group">
                    <label for="userInput">Sorgu / İstem</label>
                    <textarea id="userInput" class="form-control" placeholder="Sorunuzu girin..." required></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span id="btnText">Yanıt Üret</span>
                </button>
            </form>

            <div class="status-box" id="statusBox">
                <i class="fa-solid fa-circle-info"></i> Model Durumu: Hazırlanıyor...
            </div>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="empty-state">
                <i class="fa-solid fa-bolt"></i>
                <p>Sistem açıldığında sorunuzu girip çalıştırabilirsiniz.</p>
            </div>
        </div>
    </div>
</div>

<!-- WebLLM Modülü CDN -->
<script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    const statusBox = document.getElementById('statusBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const aiForm = document.getElementById('aiForm');
    const userInput = document.getElementById('userInput');
    const resultsContainer = document.getElementById('resultsContainer');

    // Hafif ve hızlı çalışan açık kaynaklı Türkçe/İngilizce destekli model
    const selectedModel = "Llama-3-8B-Instruct-q4f16_1-MLC";
    let engine;

    async function initModel() {
        try {
            statusBox.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Tarayıcı Yapay Zekası Yükleniyor...';
            submitBtn.disabled = true;

            engine = await webllm.CreateMLCEngine(
                selectedModel,
                { initProgressCallback: (report) => {
                    statusBox.innerText = report.text;
                }}
            );

            statusBox.innerHTML = '<i class="fa-solid fa-check" style="color: var(--accent-green);"></i> Model Hazır (Tarayıcıda Çalışıyor)';
            submitBtn.disabled = false;
        } catch (err) {
            console.error("WebGPU Destek Hatası:", err);
            statusBox.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i> Chrome WebGPU desteği aktif değil veya tarayıcı uyumsuz.';
        }
    }

    // Uygulama Başlatma
    initModel();

    aiForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const prompt = userInput.value.trim();
        if (!prompt || !engine) return;

        submitBtn.disabled = true;
        btnText.textContent = "Çıkarım Yapılıyor...";

        try {
            const messages = [
                { role: "system", content: "Sen yardımsever ve net yanıtlar veren bir yapay zeka asistanısın." },
                { role: "user", content: prompt }
            ];

            const reply = await engine.chat.completions.create({ messages });
            const responseText = reply.choices[0].message.content;

            if (document.querySelector('.empty-state')) {
                resultsContainer.innerHTML = '';
            }

            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="badge-model">LOCAL WEBGPU ENGINE</span>
                    <span style="font-size: 0.8rem; color: var(--text-secondary);">${new Date().toLocaleTimeString('tr-TR')}</span>
                </div>
                <div class="response-box">${escapeHtml(responseText)}</div>
            `;

            resultsContainer.prepend(card);
            userInput.value = '';

        } catch (err) {
            alert("İşlem sırasında hata oluştu: " + err.message);
        } finally {
            submitBtn.disabled = false;
            btnText.textContent = "Yanıt Üret";
        }
    });

    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
