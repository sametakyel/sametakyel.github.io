<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages AI Studio (Sıfır Hata)</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: rgba(19, 26, 42, 0.75);
            --bg-input: #131b2e;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: #10b981;
            
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            
            --card-radius: 18px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 10% 10%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(139, 92, 246, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2.5rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 1100px; width: 100%; }

        header { text-align: center; margin-bottom: 2.5rem; }
        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #34d399 0%, #10b981 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        header p { color: var(--text-secondary); font-size: 0.95rem; }

        .layout-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 1.75rem;
        }

        @media (max-width: 900px) { .layout-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.75rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            height: fit-content;
        }

        .panel h2 {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: #fff;
        }
        .panel h2 i { color: var(--accent-green); }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.5rem; }

        .form-control {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }
        .form-control:focus { border-color: var(--border-focus); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        textarea.form-control { height: 130px; resize: none; line-height: 1.5; }

        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, var(--accent-green) 0%, #059669 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: var(--transition);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
        }
        .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(16, 185, 129, 0.35); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .results-container { display: flex; flex-direction: column; gap: 1.25rem; }

        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            backdrop-filter: blur(16px);
            animation: fadeInUp 0.4s ease forwards;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .badge-model {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }

        .response-box {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #f1f5f9;
            background: rgba(9, 13, 22, 0.6);
            padding: 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: pre-wrap;
        }

        .empty-state {
            text-align: center;
            padding: 3.5rem 1rem;
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; color: var(--accent-green); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GitHub Pages AI Studio</h1>
        <p>API Key Gerektirmeyen Canlı ve Ücretsiz Yapay Zeka Entegrasyonu</p>
    </header>

    <div class="layout-grid">
        <div class="panel">
            <h2><i class="fa-solid fa-brain"></i> İstem Paneli</h2>
            <form id="aiForm">
                <div class="form-group">
                    <label for="userInput">Sorgu / İstem</label>
                    <textarea id="userInput" class="form-control" placeholder="Sorunuzu veya talebinizi girin..." required></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span id="btnText">Yanıt Üret</span>
                </button>
            </form>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="empty-state">
                <i class="fa-solid fa-sparkles"></i>
                <p>Sorunuzu yazıp düğmeye tıklayın.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const aiForm = document.getElementById('aiForm');
    const userInput = document.getElementById('userInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const resultsContainer = document.getElementById('resultsContainer');

    aiForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const prompt = userInput.value.trim();
        if (!prompt) return;

        submitBtn.disabled = true;
        btnText.textContent = "Bağlanıyor ve Yanıtlanıyor...";

        try {
            // Step 1: DuckDuckGo Anonim VKEY (Token) Alma
            const tokenRes = await fetch("https://duckduckgo.com/duckchat/v1/status", {
                headers: { "x-vqd-accept": "1" }
            });

            if (!tokenRes.ok) throw new Error("Sunucudan yetkilendirme jetonu alınamadı.");
            const vqd = tokenRes.headers.get("x-vqd-4");

            // Step 2: Yapay Zeka Model Oturumu Açma ve Sorgulama
            const chatRes = await fetch("https://duckduckgo.com/duckchat/v1/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-vqd-4": vqd
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: [{ role: "user", content: prompt }]
                })
            });

            if (!chatRes.ok) throw new Error("Yapay zeka yanıt veremedi.");

            // Step 3: Stream Yanıtını İşleme
            const reader = chatRes.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value);
                const lines = chunk.split("\n");

                for (const line of lines) {
                    if (line.startsWith("data: ")) {
                        const dataStr = line.replace("data: ", "").trim();
                        if (dataStr === "[DONE]") break;
                        try {
                            const parsed = JSON.parse(dataStr);
                            if (parsed.message) {
                                fullText += parsed.message;
                            }
                        } catch (pErr) {}
                    }
                }
            }

            if (document.querySelector('.empty-state')) {
                resultsContainer.innerHTML = '';
            }

            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="badge-model">GPT-4o MINI (ANONYMOUS ENGINE)</span>
                    <span style="font-size: 0.8rem; color: var(--text-secondary);">${new Date().toLocaleTimeString('tr-TR')}</span>
                </div>
                <div class="response-box">${escapeHtml(fullText || "Yanıt alınamadı.")}</div>
            `;

            resultsContainer.prepend(card);
            userInput.value = '';

        } catch (err) {
            console.error("Hata Detayı:", err);
            alert("Bağlantı Hatası: " + err.message);
        } finally {
            submitBtn.disabled = false;
            btnText.textContent = "Yanıt Üret";
        }
    });

    function escapeHtml(str) {
        return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
